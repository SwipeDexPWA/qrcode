<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stable QR Generator</title>

<style>
body{
    font-family: Arial;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:20px;
    background:#eee;
}

canvas{
    width:500px;
    max-width:100%;
    background:#fff;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

button, select{
    padding:8px;
    border-radius:6px;
}
</style>
</head>
<body>

<select id="mode">
    <option value="center">Center Logo Mode</option>
    <option value="background">Full Background Logo Mode</option>
</select>

<canvas id="qr" width="1200" height="1200"></canvas>

<button id="download">Download</button>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<script>

const URL = "https://swipedex.app";
const LOGO = "logo.png";

const canvas = document.getElementById("qr");
const ctx = canvas.getContext("2d");
const SIZE = canvas.width;

document.getElementById("mode").addEventListener("change", generate);

generate();

async function generate(){

    const mode = document.getElementById("mode").value;

    const qr = qrcode(0, "H");
    qr.addData(URL);
    qr.make();

    const count = qr.getModuleCount();

    // ✅ FIX: integer-safe sizing + quiet zone
    const quietZone = 80;
    const usable = SIZE - quietZone * 2;
    const cell = Math.floor(usable / count);

    const qrSize = cell * count;
    const offset = Math.floor((SIZE - qrSize) / 2);

    const logo = await loadImage(LOGO);

    // reset canvas
    ctx.clearRect(0,0,SIZE,SIZE);

    // base
    ctx.fillStyle = "#fff";
    ctx.fillRect(0,0,SIZE,SIZE);

    // background logo (SAFE visual only)
    if(mode === "background"){
        ctx.drawImage(logo,0,0,SIZE,SIZE);
    }

    ctx.fillStyle = "#000";

    // =========================
    // QR MODULES (PIXEL SAFE GRID)
    // =========================
    for(let r=0;r<count;r++){
        for(let c=0;c<count;c++){

            if(!qr.isDark(r,c)) continue;
            if(isFinder(r,c,count)) continue;

            const x = offset + c * cell;
            const y = offset + r * cell;

            ctx.fillRect(x, y, cell, cell);
        }
    }

    // =========================
    // FINDER PATTERNS (SAFE)
    // =========================
    drawEye(offset, offset, cell);
    drawEye(offset + (count-7)*cell, offset, cell);
    drawEye(offset, offset + (count-7)*cell, cell);

    // center logo ONLY in center mode
    if(mode === "center"){
        drawCenterLogo(logo);
    }
}

// ---------------- EYES (QR STANDARD SAFE) ----------------
function drawEye(x, y, cell){

    const size = cell * 7;

    ctx.fillStyle = "#000";
    ctx.fillRect(x, y, size, size);

    ctx.fillStyle = "#fff";
    ctx.fillRect(x + cell, y + cell, size - cell*2, size - cell*2);

    ctx.fillStyle = "#000";
    ctx.fillRect(x + cell*2, y + cell*2, size - cell*4, size - cell*4);
}

// ---------------- CENTER LOGO ----------------
function drawCenterLogo(img){

    const size = SIZE * 0.22;

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(SIZE/2, SIZE/2, size/2 + 10, 0, Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(SIZE/2, SIZE/2, size/2, 0, Math.PI*2);
    ctx.clip();

    ctx.drawImage(
        img,
        (SIZE - size) / 2,
        (SIZE - size) / 2,
        size,
        size
    );

    ctx.restore();
}

// ---------------- HELPERS ----------------
function isFinder(r,c,n){
    return (
        (r<9 && c<9) ||
        (r<9 && c>n-10) ||
        (r>n-10 && c<9)
    );
}

function loadImage(src){
    return new Promise((res,rej)=>{
        const img = new Image();
        img.onload = ()=>res(img);
        img.onerror = rej;
        img.src = src;
    });
}

// download
document.getElementById("download").onclick = ()=>{
    const a = document.createElement("a");
    a.download = "qr.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
};

</script>

</body>
</html>
