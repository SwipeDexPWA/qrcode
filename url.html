<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Production Safe QR</title>

<style>
body{
    font-family: Arial;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:20px;
    background:#eee;
}

canvas{
    width:500px;
    height:500px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}
</style>
</head>
<body>

<canvas id="qr" width="600" height="600"></canvas>

<button id="download">Download</button>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<script>

const URL = "https://swipedex.app";
const LOGO = "logo.png";

const canvas = document.getElementById("qr");
const ctx = canvas.getContext("2d");

const SIZE = canvas.width;

draw();

async function draw(){

    const qr = qrcode(0,"H");
    qr.addData(URL);
    qr.make();

    const count = qr.getModuleCount();

    const cell = Math.floor(SIZE / count);
    const qrSize = cell * count;
    const offset = Math.floor((SIZE - qrSize) / 2);

    const logo = await loadImage(LOGO);

    ctx.clearRect(0,0,SIZE,SIZE);

    // =========================
    // BACKGROUND IMAGE (SAFE DIMMED)
    // =========================
    ctx.drawImage(logo,0,0,SIZE,SIZE);

    // DARK OVERLAY TO GUARANTEE CONTRAST
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(0,0,SIZE,SIZE);

    // =========================
    // WHITE QR PLATE (CRITICAL FIX)
    // =========================
    const pad = cell * 2;

    ctx.fillStyle = "#fff";
    ctx.fillRect(
        offset - pad,
        offset - pad,
        qrSize + pad*2,
        qrSize + pad*2
    );

    // =========================
    // QR (PURE BLACK ONLY)
    // =========================
    ctx.fillStyle = "#000";

    for(let r=0;r<count;r++){
        for(let c=0;c<count;c++){

            if(!qr.isDark(r,c)) continue;

            ctx.fillRect(
                offset + c * cell,
                offset + r * cell,
                cell,
                cell
            );
        }
    }

    // =========================
    // CENTER LOGO (SAFE ZONE ONLY)
    // =========================
    drawLogo(logo);
}

// ---------------- CENTER LOGO ----------------
function drawLogo(img){

    const size = 140;

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(SIZE/2,SIZE/2,size/2+10,0,Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(SIZE/2,SIZE/2,size/2,0,Math.PI*2);
    ctx.clip();

    ctx.drawImage(
        img,
        SIZE/2 - size/2,
        SIZE/2 - size/2,
        size,
        size
    );

    ctx.restore();
}

// ---------------- IMAGE ----------------
function loadImage(src){
    return new Promise((res,rej)=>{
        const img = new Image();
        img.onload = ()=>res(img);
        img.onerror = rej;
        img.src = src;
    });
}

// ---------------- DOWNLOAD ----------------
document.getElementById("download").onclick = ()=>{
    const a = document.createElement("a");
    a.download = "qr.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
};

</script>

</body>
</html>
