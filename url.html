<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QR Stable + Background Adaptive</title>

<style>
body{
    font-family: Arial;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:20px;
    background:#eee;
}

canvas{
    width:500px;
    height:500px;
    background:#fff;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

button, select{
    padding:8px;
}
</style>
</head>
<body>

<select id="mode">
    <option value="center">Center Logo Mode</option>
    <option value="bg">Background Logo Mode</option>
</select>

<canvas id="qr" width="600" height="600"></canvas>

<button id="download">Download</button>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<script>

const URL = "https://swipedex.app";
const LOGO = "logo.png";

const canvas = document.getElementById("qr");
const ctx = canvas.getContext("2d");

// IMPORTANT: prevents blur/scaling artifacts
ctx.imageSmoothingEnabled = false;

const SIZE = canvas.width;

document.getElementById("mode").addEventListener("change", draw);

draw();

async function draw(){

    const mode = document.getElementById("mode").value;

    const qr = qrcode(0, "H");
    qr.addData(URL);
    qr.make();

    const count = qr.getModuleCount();

    const cell = Math.floor(SIZE / count);
    const qrSize = cell * count;
    const offset = Math.floor((SIZE - qrSize) / 2);

    const logo = await loadImage(LOGO);

    // reset
    ctx.clearRect(0,0,SIZE,SIZE);

    // base background
    ctx.fillStyle = "#fff";
    ctx.fillRect(0,0,SIZE,SIZE);

    // =========================
    // BACKGROUND IMAGE
    // =========================
    if(mode === "bg"){
        ctx.drawImage(logo,0,0,SIZE,SIZE);
    }

    // =========================
    // GLOBAL CONTRAST DECISION
    // =========================
    let qrColor = "#000";

    if(mode === "bg"){
        const temp = document.createElement("canvas");
        temp.width = SIZE;
        temp.height = SIZE;
        const tctx = temp.getContext("2d");

        tctx.drawImage(logo,0,0,SIZE,SIZE);

        const data = tctx.getImageData(0,0,SIZE,SIZE).data;

        let sum = 0;
        let samples = 0;

        for(let i=0;i<data.length;i+=80){
            const r = data[i];
            const g = data[i+1];
            const b = data[i+2];

            sum += (r*0.299 + g*0.587 + b*0.114);
            samples++;
        }

        const avg = sum / samples;

        // invert if dark background
        qrColor = avg < 140 ? "#fff" : "#000";
    }

    ctx.fillStyle = qrColor;

    // =========================
    // QR MATRIX (SAFE GRID)
    // =========================
    for(let r=0;r<count;r++){
        for(let c=0;c<count;c++){

            if(!qr.isDark(r,c)) continue;

            const x = offset + c * cell;
            const y = offset + r * cell;

            ctx.fillRect(x, y, cell, cell);
        }
    }

    // center logo only
    if(mode === "center"){
        drawLogo(logo);
    }
}

// ---------------- CENTER LOGO ----------------
function drawLogo(img){

    const size = 140;

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(SIZE/2, SIZE/2, size/2 + 10, 0, Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(SIZE/2, SIZE/2, size/2, 0, Math.PI*2);
    ctx.clip();

    ctx.drawImage(
        img,
        SIZE/2 - size/2,
        SIZE/2 - size/2,
        size,
        size
    );

    ctx.restore();
}

// ---------------- IMAGE LOADER ----------------
function loadImage(src){
    return new Promise((res,rej)=>{
        const img = new Image();
        img.onload = ()=>res(img);
        img.onerror = rej;
        img.src = src;
    });
}

// ---------------- DOWNLOAD ----------------
document.getElementById("download").onclick = ()=>{
    const a = document.createElement("a");
    a.download = "qr.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
};

</script>

</body>
</html>
