<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QR Absolute Fix</title>

<style>
body{
    font-family: Arial;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:20px;
    background:#eee;
}

canvas{
    background:#fff;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}
</style>
</head>
<body>

<select id="mode">
    <option value="center">Center Logo</option>
    <option value="bg">Background Logo</option>
</select>

<canvas id="qr"></canvas>

<button id="download">Download</button>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<script>

const URL = "https://swipedex.app";
const LOGO = "logo.png";

const canvas = document.getElementById("qr");
const ctx = canvas.getContext("2d");

// 🚨 CRITICAL: no smoothing EVER
ctx.imageSmoothingEnabled = false;

const SIZE = 600;

canvas.width = SIZE;
canvas.height = SIZE;

document.getElementById("mode").addEventListener("change", draw);

draw();

async function draw(){

    const mode = document.getElementById("mode").value;

    const qr = qrcode(0, "H");
    qr.addData(URL);
    qr.make();

    const count = qr.getModuleCount();

    // FIXED GRID SIZE (NO MATH SHIFTS)
    const cell = Math.floor(SIZE / count);

    const qrSize = cell * count;
    const offset = Math.floor((SIZE - qrSize) / 2);

    const logo = await loadImage(LOGO);

    // reset
    ctx.clearRect(0,0,SIZE,SIZE);
    ctx.fillStyle = "#fff";
    ctx.fillRect(0,0,SIZE,SIZE);

    // background image (SAFE only visual)
    if(mode === "bg"){
        ctx.drawImage(logo,0,0,SIZE,SIZE);
    }

    ctx.fillStyle = "#000";

    // =========================
    // DRAW QR (STRICT GRID)
    // =========================
    for(let r=0;r<count;r++){
        for(let c=0;c<count;c++){

            if(!qr.isDark(r,c)) continue;

            const x = offset + c * cell;
            const y = offset + r * cell;

            ctx.fillRect(x, y, cell, cell);
        }
    }

    // NO custom eye drawing (IMPORTANT)
    // QR library already includes them correctly

    // center logo ONLY
    if(mode === "center"){
        drawLogo(logo);
    }
}

// ---------------- CENTER LOGO ----------------
function drawLogo(img){

    const size = 140;

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(SIZE/2,SIZE/2,size/2+8,0,Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(SIZE/2,SIZE/2,size/2,0,Math.PI*2);
    ctx.clip();

    ctx.drawImage(img,
        SIZE/2 - size/2,
        SIZE/2 - size/2,
        size,
        size
    );

    ctx.restore();
}

// ---------------- IMAGE ----------------
function loadImage(src){
    return new Promise((res,rej)=>{
        const img = new Image();
        img.onload = ()=>res(img);
        img.onerror = rej;
        img.src = src;
    });
}

// download
document.getElementById("download").onclick = ()=>{
    const a = document.createElement("a");
    a.download = "qr.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
};

</script>

</body>
</html>
