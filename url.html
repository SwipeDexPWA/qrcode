<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dual Mode QR 2</title>

<style>
body{
    font-family: Arial;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:20px;
    background:#eee;
}

canvas{
    width:500px;
    max-width:100%;
    background:#fff;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

button{
    padding:10px 14px;
    border:0;
    border-radius:8px;
    cursor:pointer;
}

select{
    padding:8px;
}
</style>
</head>
<body>

<select id="mode">
    <option value="center">Center Logo Mode</option>
    <option value="background">Full Background Logo Mode</option>
</select>

<canvas id="qr" width="1200" height="1200"></canvas>
<button id="download">Download</button>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<script>

const URL = "https://example.com";
const LOGO = "logo.png";

const canvas = document.getElementById("qr");
const ctx = canvas.getContext("2d");
const SIZE = canvas.width;

document.getElementById("mode").addEventListener("change", generate);

generate();

async function generate(){

    const mode = document.getElementById("mode").value;

    const qr = qrcode(0,"H");
    qr.addData(URL);
    qr.make();

    const count = qr.getModuleCount();
    const cell = SIZE / count;

    const logo = await loadImage(LOGO);

    // temp canvas for sampling
    const temp = document.createElement("canvas");
    temp.width = SIZE;
    temp.height = SIZE;
    const tctx = temp.getContext("2d");

    ctx.clearRect(0,0,SIZE,SIZE);
    ctx.fillStyle = "#fff";
    ctx.fillRect(0,0,SIZE,SIZE);

    // =========================
    // MODE B: FULL BACKGROUND
    // =========================
    if(mode === "background"){

        // full color background (NO alpha)
        ctx.drawImage(logo,0,0,SIZE,SIZE);
        tctx.drawImage(logo,0,0,SIZE,SIZE);
    }

    // =========================
    // MODE A: CENTER ONLY
    // =========================
    else{
        tctx.drawImage(logo,0,0,SIZE,SIZE);
    }

    // QR DOTS
    for(let r=0;r<count;r++){
        for(let c=0;c<count;c++){

            if(!qr.isDark(r,c)) continue;
            if(isFinder(r,c,count)) continue;

            const x = c*cell;
            const y = r*cell;

            const p = tctx.getImageData(x,y,1,1).data;

            const brightness =
                p[0]*0.299 +
                p[1]*0.587 +
                p[2]*0.114;

            // adaptive color
            const color = brightness < 140 ? "#fff" : "#000";

            drawDot(x+cell*0.5,y+cell*0.5,cell*0.65,color);
        }
    }

    // eyes
    drawEye(0,0,cell,tctx);
    drawEye(count-7,0,cell,tctx);
    drawEye(0,count-7,cell,tctx);

    // center logo only in mode A
    if(mode === "center"){
        drawCenterLogo(logo);
    }
}

// ------------------ DOT ------------------
function drawDot(x,y,size,color){
    ctx.beginPath();
    ctx.arc(x,y,size/2,0,Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();
}

// ------------------ EYES ------------------
function drawEye(c,r,cell,tctx){

    const x = c * cell;
    const y = r * cell;

    const size = cell * 7;
    const round = cell * 0.8;

    const p = tctx.getImageData(
        x + size/2,
        y + size/2,
        1,
        1
    ).data;

    const b = p[0]*0.299 + p[1]*0.587 + p[2]*0.114;

    const dark = b < 140;

    const outer = dark ? "#fff" : "#000";
    const inner = dark ? "#000" : "#fff";

    // OUTER FRAME (rounded square)
    drawRoundRect(x, y, size, size, round, outer);

    // MIDDLE CUT (white)
    drawRoundRect(
        x + cell,
        y + cell,
        size - cell*2,
        size - cell*2,
        round,
        "#fff"
    );

    // INNER DOT (black)
    drawRoundRect(
        x + cell*2,
        y + cell*2,
        size - cell*4,
        size - cell*4,
        round,
        inner
    );
}

// ------------------ CENTER LOGO ------------------
function drawCenterLogo(img){

    const size = SIZE * 0.22;

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(SIZE/2,SIZE/2,size/2+12,0,Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(SIZE/2,SIZE/2,size/2,0,Math.PI*2);
    ctx.clip();

    ctx.drawImage(
        img,
        (SIZE-size)/2,
        (SIZE-size)/2,
        size,
        size
    );

    ctx.restore();
}

// ------------------ HELPERS ------------------
function isFinder(r,c,n){
    return (
        (r<9 && c<9) ||
        (r<9 && c>n-10) ||
        (r>n-10 && c<9)
    );
}

function loadImage(src){
    return new Promise((res,rej)=>{
        const img = new Image();
        img.onload = ()=>res(img);
        img.onerror = rej;
        img.src = src;
    });
}
function drawRoundRect(x,y,w,h,r,color){

    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();

    ctx.fillStyle = color;
    ctx.fill();
}

// download
document.getElementById("download").onclick = ()=>{
    const a = document.createElement("a");
    a.download = "qr.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
};

</script>

</body>
</html>
