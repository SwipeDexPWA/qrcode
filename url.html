<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QR Adaptive Safe Background</title>

<style>
body{
    font-family: Arial;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:20px;
    background:#eee;
}

canvas{
    width:500px;
    height:500px;
    background:#fff;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}
</style>
</head>
<body>

<select id="mode">
    <option value="center">Center Logo</option>
    <option value="bg">Background Adaptive</option>
</select>

<canvas id="qr" width="600" height="600"></canvas>

<button id="download">Download</button>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<script>

const URL = "https://swipedex.app";
const LOGO = "logo.png";

const canvas = document.getElementById("qr");
const ctx = canvas.getContext("2d");

const SIZE = canvas.width;

document.getElementById("mode").addEventListener("change", draw);

draw();

async function draw(){

    const mode = document.getElementById("mode").value;

    const qr = qrcode(0,"H");
    qr.addData(URL);
    qr.make();

    const count = qr.getModuleCount();

    const cell = Math.floor(SIZE / count);
    const qrSize = cell * count;
    const offset = Math.floor((SIZE - qrSize) / 2);

    const logo = await loadImage(LOGO);

    // reset
    ctx.clearRect(0,0,SIZE,SIZE);

    // background
    ctx.fillStyle = "#fff";
    ctx.fillRect(0,0,SIZE,SIZE);

    if(mode === "bg"){
        ctx.drawImage(logo,0,0,SIZE,SIZE);
    }

    // =========================
    // LOW-RES BRIGHTNESS MAP (SAFE)
    // =========================
    let brightnessMap = [];

    if(mode === "bg"){
        const temp = document.createElement("canvas");
        temp.width = 80;   // LOW RES SAMPLE (IMPORTANT)
        temp.height = 80;

        const tctx = temp.getContext("2d");
        tctx.drawImage(logo,0,0,80,80);

        const data = tctx.getImageData(0,0,80,80).data;

        for(let y=0;y<80;y++){
            brightnessMap[y] = [];
            for(let x=0;x<80;x++){

                const i = (y*80 + x) * 4;

                const r = data[i];
                const g = data[i+1];
                const b = data[i+2];

                brightnessMap[y][x] =
                    (r*0.299 + g*0.587 + b*0.114);
            }
        }
    }

    // =========================
    // QR RENDER
    // =========================
    for(let r=0;r<count;r++){
        for(let c=0;c<count;c++){

            if(!qr.isDark(r,c)) continue;

            const x = offset + c * cell;
            const y = offset + r * cell;

            let color = "#000";

            if(mode === "bg"){
                // map QR cell → brightness map (SAFE scaling)
                const bx = Math.floor((c / count) * 80);
                const by = Math.floor((r / count) * 80);

                const b = brightnessMap[by]?.[bx] ?? 255;

                color = (b < 140) ? "#fff" : "#000";
            }

            ctx.fillStyle = color;
            ctx.fillRect(x, y, cell, cell);
        }
    }

    if(mode === "center"){
        drawLogo(logo);
    }
}

// ---------------- CENTER LOGO ----------------
function drawLogo(img){

    const size = 140;

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(SIZE/2,SIZE/2,size/2+10,0,Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(SIZE/2,SIZE/2,size/2,0,Math.PI*2);
    ctx.clip();

    ctx.drawImage(
        img,
        SIZE/2 - size/2,
        SIZE/2 - size/2,
        size,
        size
    );

    ctx.restore();
}

// ---------------- IMAGE ----------------
function loadImage(src){
    return new Promise((res,rej)=>{
        const img = new Image();
        img.onload = ()=>res(img);
        img.onerror = rej;
        img.src = src;
    });
}

// ---------------- DOWNLOAD ----------------
document.getElementById("download").onclick = ()=>{
    const a = document.createElement("a");
    a.download = "qr.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
};

</script>

</body>
</html>
