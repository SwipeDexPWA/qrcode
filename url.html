<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stable QR Fixed</title>

<style>
body{
    font-family: Arial;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:20px;
    background:#eee;
}

canvas{
    width:500px;
    max-width:100%;
    background:#fff;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

button, select{
    padding:8px;
}
</style>
</head>
<body>

<select id="mode">
    <option value="center">Center Logo Mode</option>
    <option value="background">Full Background Logo Mode</option>
</select>

<canvas id="qr" width="1200" height="1200"></canvas>
<button id="download">Download</button>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<script>

const URL = "https://swipedex.app";
const LOGO = "logo.png";

const canvas = document.getElementById("qr");
const ctx = canvas.getContext("2d");
const SIZE = canvas.width;

document.getElementById("mode").addEventListener("change", generate);

generate();

async function generate(){

    const mode = document.getElementById("mode").value;

    const qr = qrcode(0,"H");
    qr.addData(URL);
    qr.make();

    const count = qr.getModuleCount();
    const cell = SIZE / count;

    const logo = await loadImage(LOGO);

    ctx.clearRect(0,0,SIZE,SIZE);

    // base
    ctx.fillStyle = "#fff";
    ctx.fillRect(0,0,SIZE,SIZE);

    // background logo (visual only)
    if(mode === "background"){
        ctx.drawImage(logo,0,0,SIZE,SIZE);
    }

    // =========================
    // QR MODULES (SAFE GRID ONLY)
    // =========================
    ctx.fillStyle = "#000";

    for(let r=0;r<count;r++){
        for(let c=0;c<count;c++){

            if(!qr.isDark(r,c)) continue;
            if(isFinder(r,c,count)) continue;

            const x = c * cell;
            const y = r * cell;

            drawSquare(
                x,
                y,
                cell
            );
        }
    }

    // eyes (FIXED SAFE VERSION)
    drawEye(0,0,cell);
    drawEye(count-7,0,cell);
    drawEye(0,count-7,cell);

    // center logo only in center mode
    if(mode === "center"){
        drawCenterLogo(logo);
    }
}

// ---------------- QR DOT (SQUARE SAFE) ----------------
function drawSquare(x,y,size){
    ctx.fillRect(
        Math.floor(x),
        Math.floor(y),
        Math.ceil(size),
        Math.ceil(size)
    );
}

// ---------------- EYES (STANDARD QR STRUCTURE) ----------------
function drawEye(c,r,cell){

    const x = c * cell;
    const y = r * cell;

    const size = cell * 7;

    // outer black
    ctx.fillStyle = "#000";
    ctx.fillRect(x, y, size, size);

    // inner white
    ctx.fillStyle = "#fff";
    ctx.fillRect(x + cell, y + cell, size - cell*2, size - cell*2);

    // inner black
    ctx.fillStyle = "#000";
    ctx.fillRect(x + cell*2, y + cell*2, size - cell*4, size - cell*4);
}

// ---------------- CENTER LOGO ----------------
function drawCenterLogo(img){

    const size = SIZE * 0.22;

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(SIZE/2,SIZE/2,size/2+10,0,Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(SIZE/2,SIZE/2,size/2,0,Math.PI*2);
    ctx.clip();

    ctx.drawImage(
        img,
        (SIZE-size)/2,
        (SIZE-size)/2,
        size,
        size
    );

    ctx.restore();
}

// ---------------- HELPERS ----------------
function isFinder(r,c,n){
    return (
        (r<9 && c<9) ||
        (r<9 && c>n-10) ||
        (r>n-10 && c<9)
    );
}

function loadImage(src){
    return new Promise((res,rej)=>{
        const img = new Image();
        img.onload = ()=>res(img);
        img.onerror = rej;
        img.src = src;
    });
}

// download
document.getElementById("download").onclick = ()=>{
    const a = document.createElement("a");
    a.download = "qr.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
};

</script>

</body>
</html>
