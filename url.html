<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Branded QR</title>

<style>
body{
    font-family: Arial;
    background:#f2f2f2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px;
    padding:20px;
}

canvas{
    width:500px;
    max-width:100%;
    background:white;
    border-radius:16px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

button{
    padding:10px 16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>
<body>

<canvas id="qr" width="1200" height="1200"></canvas>
<button id="download">Download PNG</button>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<script>

const SHARE_URL = "https://example.com";
const LOGO_URL = "logo.png";

const canvas = document.getElementById("qr");
const ctx = canvas.getContext("2d");
const SIZE = canvas.width;

generate();

async function generate(){

    const qr = qrcode(0, "H");
    qr.addData(SHARE_URL);
    qr.make();

    const modules = qr.getModuleCount();
    const cell = SIZE / modules;

    const logo = await loadImage(LOGO_URL);

    // temp canvas for sampling logo pixels
    const temp = document.createElement("canvas");
    temp.width = SIZE;
    temp.height = SIZE;
    const tctx = temp.getContext("2d");

    // draw logo into temp
    tctx.drawImage(logo, 0, 0, SIZE, SIZE);

    // background
    ctx.fillStyle = "#fff";
    ctx.fillRect(0,0,SIZE,SIZE);

    // full background logo (faded)
    ctx.globalAlpha = 0.12;
    ctx.drawImage(logo, 0, 0, SIZE, SIZE);
    ctx.globalAlpha = 1;

    // QR modules
    for(let r=0; r<modules; r++){
        for(let c=0; c<modules; c++){

            if(!qr.isDark(r,c)) continue;
            if(isFinderArea(r,c,modules)) continue;

            const x = c * cell;
            const y = r * cell;

            const px = Math.floor(x);
            const py = Math.floor(y);

            const p = tctx.getImageData(px, py, 1, 1).data;

            const brightness =
                (p[0]*0.299 + p[1]*0.587 + p[2]*0.114);

            let color = (brightness < 140) ? "#fff" : "#000";

            drawDot(
                x + cell*0.15,
                y + cell*0.15,
                cell*0.7,
                color
            );
        }
    }

    // circular eyes
    drawEye(0,0,cell,tctx);
    drawEye(modules-7,0,cell,tctx);
    drawEye(0,modules-7,cell,tctx);

    // center logo
    drawCenterLogo(logo);
}

function drawDot(x,y,size,color){

    ctx.beginPath();
    ctx.arc(
        x + size/2,
        y + size/2,
        size/2,
        0,
        Math.PI*2
    );

    ctx.fillStyle = color;
    ctx.fill();
}

function drawEye(col,row,cell,tctx){

    const cx = col*cell + cell*3.5;
    const cy = row*cell + cell*3.5;

    const p = tctx.getImageData(cx,cy,1,1).data;

    const b = p[0]*0.299 + p[1]*0.587 + p[2]*0.114;
    const dark = b < 140;

    const outer = dark ? "#fff" : "#000";
    const middle = dark ? "#000" : "#fff";
    const inner = dark ? "#fff" : "#000";

    // outer
    ctx.beginPath();
    ctx.arc(cx,cy,cell*3.5,0,Math.PI*2);
    ctx.fillStyle = outer;
    ctx.fill();

    // middle
    ctx.beginPath();
    ctx.arc(cx,cy,cell*2.5,0,Math.PI*2);
    ctx.fillStyle = middle;
    ctx.fill();

    // inner
    ctx.beginPath();
    ctx.arc(cx,cy,cell*1.5,0,Math.PI*2);
    ctx.fillStyle = inner;
    ctx.fill();
}

function isFinderArea(r,c,count){
    return (
        (r < 9 && c < 9) ||
        (r < 9 && c > count-10) ||
        (r > count-10 && c < 9)
    );
}

function drawCenterLogo(img){

    const size = SIZE * 0.22;
    const x = (SIZE-size)/2;
    const y = (SIZE-size)/2;

    // white circle background
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(SIZE/2,SIZE/2,size/2+15,0,Math.PI*2);
    ctx.fill();

    // clip logo into circle
    ctx.save();
    ctx.beginPath();
    ctx.arc(SIZE/2,SIZE/2,size/2,0,Math.PI*2);
    ctx.clip();

    ctx.drawImage(img,x,y,size,size);

    ctx.restore();
}

function loadImage(src){
    return new Promise((res,rej)=>{
        const img = new Image();
        img.onload = ()=>res(img);
        img.onerror = rej;
        img.src = src;
    });
}

// download
document.getElementById("download").onclick = ()=>{
    const a = document.createElement("a");
    a.download = "qr.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
};

</script>

</body>
</html>
