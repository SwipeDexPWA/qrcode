<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fixed Branded QR</title>

<style>
body{
    font-family: Arial;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:20px;
    background:#eee;
}

canvas{
    width:500px;
    max-width:100%;
    background:#fff;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

button, select{
    padding:10px;
    border-radius:8px;
}
</style>
</head>
<body>

<select id="mode">
    <option value="center">Center Logo Mode</option>
    <option value="background">Full Background Mode</option>
</select>

<canvas id="qr" width="1200" height="1200"></canvas>
<button id="download">Download</button>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<script>

const URL = "https://example.com";
const LOGO = "logo.png";

const canvas = document.getElementById("qr");
const ctx = canvas.getContext("2d");
const SIZE = canvas.width;

document.getElementById("mode").addEventListener("change", generate);

generate();

async function generate(){

    const mode = document.getElementById("mode").value;

    const qr = qrcode(0,"H");
    qr.addData(URL);
    qr.make();

    const count = qr.getModuleCount();
    const cell = SIZE / count;

    const logo = await loadImage(LOGO);

    const temp = document.createElement("canvas");
    temp.width = SIZE;
    temp.height = SIZE;
    const tctx = temp.getContext("2d");

    // reset
    ctx.clearRect(0,0,SIZE,SIZE);
    ctx.fillStyle = "#fff";
    ctx.fillRect(0,0,SIZE,SIZE);

    // =========================
    // BACKGROUND HANDLING
    // =========================

    if(mode === "background"){
        // FULL COLOR BACKGROUND
        ctx.drawImage(logo,0,0,SIZE,SIZE);
        tctx.drawImage(logo,0,0,SIZE,SIZE);
    } else {
        tctx.drawImage(logo,0,0,SIZE,SIZE);
    }

    // =========================
    // QR DOTS (FIXED LOGIC)
    // =========================

    for(let r=0;r<count;r++){
        for(let c=0;c<count;c++){

            if(!qr.isDark(r,c)) continue;
            if(isFinder(r,c,count)) continue;

            const x = c*cell;
            const y = r*cell;

            let color = "#000";

            // ONLY apply adaptive coloring in background mode
            if(mode === "background"){
                const p = tctx.getImageData(x,y,1,1).data;

                const brightness =
                    p[0]*0.299 +
                    p[1]*0.587 +
                    p[2]*0.114;

                // IMPORTANT FIX:
                // force high contrast only (NO mid-gray logic)
                color = brightness < 160 ? "#fff" : "#000";
            }

            drawDot(x+cell/2,y+cell/2,cell*0.55,color);
        }
    }

    // =========================
    // EYES (FIXED THICKNESS)
    // =========================

    drawEye(0,0,cell,tctx);
    drawEye(count-7,0,cell,tctx);
    drawEye(0,count-7,cell,tctx);

    // center logo only in center mode
    if(mode === "center"){
        drawCenterLogo(logo);
    }
}

// ---------------- DOT ----------------
function drawDot(x,y,size,color){
    ctx.beginPath();
    ctx.arc(x,y,size/2,0,Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();
}

// ---------------- EYES (FIXED NORMAL THICKNESS) ----------------
function drawEye(c,r,cell,tctx){

    const cx = c*cell + cell*3.5;
    const cy = r*cell + cell*3.5;

    const p = tctx.getImageData(cx,cy,1,1).data;

    const b =
        p[0]*0.299 +
        p[1]*0.587 +
        p[2]*0.114;

    const dark = b < 160;

    const outer = dark ? "#fff" : "#000";
    const inner = dark ? "#000" : "#fff";

    // FIXED: normal QR eye size (NO overweight circles)
    ctx.beginPath();
    ctx.arc(cx,cy,cell*3.0,0,Math.PI*2);
    ctx.fillStyle = outer;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx,cy,cell*2.0,0,Math.PI*2);
    ctx.fillStyle = inner;
    ctx.fill();
}

// ---------------- CENTER LOGO ----------------
function drawCenterLogo(img){

    const size = SIZE * 0.22;

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(SIZE/2,SIZE/2,size/2+10,0,Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(SIZE/2,SIZE/2,size/2,0,Math.PI*2);
    ctx.clip();

    ctx.drawImage(img,
        (SIZE-size)/2,
        (SIZE-size)/2,
        size,
        size
    );

    ctx.restore();
}

// ---------------- HELPERS ----------------
function isFinder(r,c,n){
    return (
        (r<9 && c<9) ||
        (r<9 && c>n-10) ||
        (r>n-10 && c<9)
    );
}

function loadImage(src){
    return new Promise((res,rej)=>{
        const img = new Image();
        img.onload = ()=>res(img);
        img.onerror = rej;
        img.src = src;
    });
}

// download
document.getElementById("download").onclick = ()=>{
    const a = document.createElement("a");
    a.download = "qr.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
};

</script>

</body>
</html>
